# dwsim-runner CI (GPL-3.0)
#
# Tier A tests (DwsimRunner.Api.Tests) run with NO DWSIM on the host: they use
# the FakeWorker stub for the process boundary, so they're CI-safe and fast.
# The real DWSIM-gated Tier B suite self-skips unless SIM_RUNNER_URL points at
# a running runner with DWSIM, so it is not run here.
#
# The Worker project references DWSIM assemblies at compile time (Private=false),
# so the `worker` job fetches the pinned DWSIM release into ./dwsim (never
# committed, never published — see scripts/fetch-dwsim.sh) and compiles the
# Worker and its unit tier against it. ISK-442: until then nothing in CI compiled
# the Worker at all, so a change that broke it surfaced only in a Docker build.
# The `build-and-test` job still builds the Api and FakeWorker with NO DWSIM on the
# host, runs Tier A, and asserts the Api publish output contains zero DWSIM.* DLLs
# (Constitution IV: no conveyance).
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build (Tier A) + no-conveyance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/DwsimRunner.Api.Tests/DwsimRunner.Api.Tests.csproj

      - name: Build Tier A projects (Api + FakeWorker; Worker needs DWSIM, built in Docker)
        run: dotnet build tests/DwsimRunner.Api.Tests/DwsimRunner.Api.Tests.csproj --no-restore -c Release

      - name: Publish Api to a clean directory (no DWSIM_PATH set → Worker skipped, refs unresolved)
        run: dotnet publish src/DwsimRunner.Api -c Release -o publish/api --no-restore

      - name: Run Tier A tests (FakeWorker — no DWSIM required)
        run: dotnet test tests/DwsimRunner.Api.Tests/DwsimRunner.Api.Tests.csproj --no-restore -c Release --nologo

      - name: Assert no DWSIM.* DLLs in Api publish output (Constitution IV)
        run: |
          set -e
          leaks=$(find publish/api -iname 'DWSIM.*' -type f -print || true)
          if [ -n "$leaks" ]; then
            echo "::error::DWSIM binaries leaked into publish output (no-conveyance violation):"
            echo "$leaks"
            exit 1
          fi
          echo "publish/api is clean of DWSIM.* — no-conveyance OK"

  worker:
    name: Build Worker (against the pinned DWSIM)
    runs-on: ubuntu-latest
    env:
      DWSIM_PATH: ${{ github.workspace }}/dwsim
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Keyed on the fetch script, which pins the DWSIM version: bumping the version is a
      # script edit, which is a cache miss. The binaries live only in the runner's cache.
      - name: Cache DWSIM
        uses: actions/cache@v4
        with:
          path: dwsim
          key: dwsim-${{ runner.os }}-${{ hashFiles('scripts/fetch-dwsim.sh') }}

      - name: Fetch DWSIM
        run: scripts/fetch-dwsim.sh

      - name: Build Worker
        run: dotnet build src/DwsimRunner.Worker/DwsimRunner.Worker.csproj -c Release

      - name: Build Worker unit tier
        run: dotnet build tests/DwsimRunner.Worker.Tests/DwsimRunner.Worker.Tests.csproj -c Release

      # iskra 285 — the read worker's sandbox, measured on this runner's own Linux kernel (native
      # x86-64, a non-root user). These run the real worker as a child process; they need the DWSIM
      # path only to start it, never the engine. The rest of the unit tier is still not run here.
      - name: Read-sandbox conformance tests (Category=Sandbox)
        run: dotnet test tests/DwsimRunner.Worker.Tests/DwsimRunner.Worker.Tests.csproj -c Release --no-build --filter Category=Sandbox --logger "console;verbosity=normal" -- RunConfiguration.DisableParallelization=true

# SaaS / dev mode — DWSIM bundled in the image (see Dockerfile)
services:
  dwsim-runner:
    build: .
    # DWSIM's Linux release ships amd64-only native libs; on Apple Silicon
    # this builds/runs under Rosetta emulation.
    platform: linux/amd64
    ports: ["8080:8080"]
    environment:
      SOLVE_TIMEOUT_SECONDS: "60"
      MAX_CONCURRENT_SOLVES: "6"
      # Shared API key (FR-016). REQUIRED — the runner fails closed: with no key set it
      # answers 503 AUTH_NOT_CONFIGURED on every route except GET /health
      # (FND-0002/FND-0075). The default below is a local-dev convenience, not a secret;
      # override RUNNER_API_KEY for anything another host can reach.
      RUNNER_API_KEY: "${RUNNER_API_KEY:-local-dev-key}"
      USER_TEMPLATES_PATH: /user-templates
    volumes:
      - ./templates:/templates:ro
      - ./user-templates:/user-templates
    deploy:
      resources:
        limits:
          memory: 8g   # ~1–2 GB per concurrent worker + headroom
